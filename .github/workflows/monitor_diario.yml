name: Monitor DODF + DOE-TCDF Diário

on:
  schedule:
    # DOE-TCDF: 01h00 BRT (04h00 UTC) — pega a edição das 00h01
    - cron: '0 4 * * 1-5'
    # DODF: 06h00 BRT (09h00 UTC) — pega a edição principal das 05h
    - cron: '0 9 * * 1-5'
    # DODF: 11h00 BRT (14h00 UTC) — pega extras das 10h
    - cron: '0 14 * * 1-5'
    # DODF: 17h00 BRT (20h00 UTC) — pega extras das 16h
    - cron: '0 20 * * 1-5'
    # DODF: 23h00 BRT (02h00 UTC dia seguinte) — pega extras das 22h
    - cron: '0 2 * * 2-6'
  workflow_dispatch:

jobs:
  detect-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      
      # DOE-TCDF roda apenas no cron das 04h UTC
      - name: Monitor DOE-TCDF
        if: github.event.schedule == '0 4 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: python scripts/doe_tcdf_monitor.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      
      # DODF roda em todos os outros crons + manual
      - name: Monitor DODF
        if: github.event.schedule != '0 4 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: python scripts/dodf_monitor.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
